  <g font-family="monospace" font-size="12" fill="#F8FAFC" text-anchor="end" font-weight="bold">
    <text x="860" y="160">Rehan</text>
    <text x="860" y="180">IoT &amp; Embedded Systems Engineer</text>
    <text x="860" y="200">Pekanbaru, Indonesia</text>
    <text x="860" y="220">BSc in Electronics Technology</text>
    <text x="860" y="240">Building + Tinkering + Shipping</text>
    <text x="860" y="260">VS Code, Arduino IDE, Git, Figma</text>

    <text x="860" y="290">C++, C, Python, PHP</text>
    <text x="860" y="310">ESP32, Arduino, Raspberry Pi</text>
    <text x="860" y="330">MQTT, Smart Sensors, Cloud</text>
    <text x="860" y="350">Laravel, React, Tailwind</text>

    <text x="860" y="400">@Han0953</text>
    <text x="860" y="420" fill="#A78BFA">building soon...</text>
