    <text x="440" y="160">.............................................</text>
    <text x="440" y="180">.............................................</text>
    <text x="440" y="200">.............................................</text>
    <text x="460" y="220">...........................................</text>
    <text x="440" y="240">.............................................</text>
    <text x="460" y="260">...........................................</text>
    
    <text x="460" y="290">...........................................</text>
    <text x="490" y="310">........................................</text>
    <text x="450" y="330">............................................</text>
    <text x="450" y="350">............................................</text>

    <text x="470" y="400">.........................................</text>
    <text x="490" y="420">........................................</text>
  </g>

