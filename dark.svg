<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <!-- Background & Border -->
  <rect width="900" height="450" rx="12" fill="#0A101F" stroke="#22D3EE" stroke-width="1.5"/>
  <rect x="5" y="5" width="890" height="440" rx="10" fill="none" stroke="#A78BFA" stroke-width="0.5" opacity="0.5"/>

  <!-- macOS Window Controls -->
  <circle cx="30" cy="30" r="6" fill="#FF5F56" />
  <circle cx="50" cy="30" r="6" fill="#FFBD2E" />
  <circle cx="70" cy="30" r="6" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="450" y="34" font-family="monospace" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="1">rehan.connect@umri.ac.id - % ./profile.sh --live</text>
  
  <!-- Left Column: Visual Map / ASCII Art -->
  <text x="40" y="80" font-family="monospace" font-size="10" fill="#475569" letter-spacing="2">V I S U A L . M A P</text>
  <!-- Frame around ASCII -->
  <path d="M 40 100 L 55 100 M 40 100 L 40 115" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M 330 100 L 315 100 M 330 100 L 330 115" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M 40 380 L 55 380 M 40 380 L 40 365" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M 330 380 L 315 380 M 330 380 L 330 365" fill="none" stroke="#22D3EE" stroke-width="2"/>
  
  <!-- Cool Glowing IoT/Code ASCII -->
  <g transform="translate(70, 160)" font-family="monospace" font-size="28" fill="#A78BFA" font-weight="bold">
    <text x="0" y="0">&lt; / &gt;</text>
    <text x="30" y="70" font-size="16" fill="#22D3EE">ESP32</text>
    <text x="-20" y="40" font-size="12" fill="#10B981">MQTT</text>
    <text x="80" y="20" font-size="12" fill="#F8FAFC">IOT</text>
  </g>
  <!-- Decorative dots to simulate particles -->
  <circle cx="100" cy="140" r="1.5" fill="#22D3EE" opacity="0.8"/>
  <circle cx="180" cy="250" r="1.5" fill="#A78BFA" opacity="0.6"/>
  <circle cx="250" cy="180" r="2" fill="#10B981" opacity="0.7"/>
  <circle cx="80" cy="300" r="1" fill="#F8FAFC" opacity="0.5"/>
  <circle cx="150" cy="320" r="1.5" fill="#22D3EE" opacity="0.9"/>
  <circle cx="280" cy="280" r="1.5" fill="#A78BFA" opacity="0.8"/>

